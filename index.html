<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer"><title>PICE-CDMSC Live QR Scanner</title>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
:root{font-family:Arial,sans-serif;color:#172b4d;background:#eef2f6}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1000px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #d9e1ea;border-radius:12px;padding:20px;margin-bottom:16px;box-shadow:0 3px 14px #0000000d}h1,h2{color:#17365d;margin-top:0}.grid{display:grid;grid-template-columns:1.3fr .7fr;gap:18px}label{display:block;font-weight:bold;margin:10px 0 6px}input{width:100%;padding:12px;border:1px solid #aebdca;border-radius:7px;font-size:16px}button{padding:12px 16px;border:0;border-radius:7px;font-weight:bold;cursor:pointer}.primary{background:#17365d;color:#fff}.secondary{background:#e8edf3;color:#17365d}button:disabled{opacity:.5;cursor:not-allowed}.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}#reader{background:#101820;border-radius:9px;overflow:hidden;min-height:280px}.status{padding:12px;border-radius:7px;margin-top:12px;background:#e8f1fb}.status.ok{background:#dff4e7;color:#12612f}.status.err{background:#fde2df;color:#9d2519}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{border:1px solid #d9e1ea;border-radius:8px;text-align:center;padding:12px 5px}.stat b{display:block;font-size:26px}.latest{border:1px solid #d9e1ea;border-radius:8px;padding:12px;margin-top:12px}ul{padding:0;list-style:none;max-height:280px;overflow:auto}li{padding:9px 3px;border-bottom:1px solid #e7ebef;font-size:13px}iframe{display:none}@media(max-width:720px){.grid{grid-template-columns:1fr}.wrap{padding:10px}.card{padding:14px}}
</style></head><body><div class="wrap">
<div class="card"><h1>PICE-CDMSC Live QR Scanner</h1><p>Enter the temporary access code generated from the Attendance page.</p>
<label for="apiUrl">Apps Script deployment URL</label><input id="apiUrl" value="https://script.google.com/macros/s/AKfycbz5amg019dei5TK7pFoMiX_wFoFTiJBZcvZUygYbK5mvlg5EoZmBjz_bYo0Mh699Nq7/exec">
<label for="accessCode">Scanner access code</label><input id="accessCode" maxlength="8" autocomplete="off" placeholder="Example: A1B2C3D4">
<div class="row"><button id="connect" class="primary">Connect to Event</button></div><div id="connectStatus" class="status">Not connected.</div></div>
<div class="card grid"><div><h2 id="eventName">No event connected</h2><div id="reader"></div><div class="row"><button id="start" class="primary" disabled>Start Scanner</button><button id="stop" class="secondary" disabled>Stop Scanner</button></div><div id="scanStatus" class="status">Connect to an event first.</div></div>
<div><div class="stats"><div class="stat"><b id="success">0</b>Successful</div><div class="stat"><b id="duplicate">0</b>Duplicates</div><div class="stat"><b id="failed">0</b>Failed</div></div><div class="latest"><b>Latest student</b><div id="latest" style="margin-top:8px">No scan yet.</div></div><h3>Recent scans</h3><ul id="history"><li>No scans yet.</li></ul></div></div>
<iframe name="apiFrame" id="apiFrame"></iframe><form id="apiForm" method="post" target="apiFrame"><input type="hidden" name="action" value="externalLiveScanner"><input type="hidden" name="operation"><input type="hidden" name="accessCode"><input type="hidden" name="qrToken"><input type="hidden" name="requestId"></form>
</div><script>
(function(){'use strict';const $=id=>document.getElementById(id);let scanner=null,running=false,processing=false,connected=false,last='',lastAt=0,session=0,counts={success:0,duplicate:0,failed:0},pending=new Map();
function status(id,text,type){const e=$(id);e.textContent=text;e.className='status '+(type||'')}
function update(){ $('success').textContent=counts.success;$('duplicate').textContent=counts.duplicate;$('failed').textContent=counts.failed }
function history(kind,text){const u=$('history');if(u.children.length===1&&u.firstElementChild.textContent==='No scans yet.')u.innerHTML='';const l=document.createElement('li');l.textContent=new Date().toLocaleTimeString()+' - '+text;l.style.color=kind==='success'?'#12612f':kind==='duplicate'?'#8a5b00':'#9d2519';u.prepend(l);while(u.children.length>12)u.lastElementChild.remove()}
function request(operation,qr){return new Promise((resolve,reject)=>{const id='r'+Date.now()+Math.random().toString(16).slice(2);const timer=setTimeout(()=>{pending.delete(id);reject(new Error('Backend request timed out.'))},20000);pending.set(id,{resolve,reject,timer});const f=$('apiForm');f.action=$('apiUrl').value.trim();f.elements.operation.value=operation;f.elements.accessCode.value=$('accessCode').value.trim().toUpperCase();f.elements.qrToken.value=qr||'';f.elements.requestId.value=id;f.submit()})}
window.addEventListener('message',e=>{if(e.source!==$('apiFrame').contentWindow||!e.data||!e.data.requestId)return;const p=pending.get(e.data.requestId);if(!p)return;clearTimeout(p.timer);pending.delete(e.data.requestId);e.data.success?p.resolve(e.data):p.reject(new Error(e.data.error||'Request failed.'))});
$('connect').addEventListener('click',async()=>{const url=$('apiUrl').value.trim(),code=$('accessCode').value.trim().toUpperCase();if(!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(url)){status('connectStatus','Enter the deployed Apps Script /exec URL.','err');return}if(!/^[A-F0-9]{8}$/.test(code)){status('connectStatus','Enter the 8-character access code.','err');return}$('connect').disabled=true;status('connectStatus','Connecting...');try{const r=await request('status');if(String(r.event.status).toUpperCase()!=='OPEN')throw new Error('The attendance event is closed.');connected=true;$('eventName').textContent=r.event.eventName+' ('+r.event.status+')';$('start').disabled=false;status('connectStatus','Connected. Access is temporary for this event.','ok');status('scanStatus','Ready to start scanning.')}catch(e){connected=false;status('connectStatus',e.message,'err')}finally{$('connect').disabled=false}});
async function detected(text){text=String(text||'').trim();const now=Date.now();if(!running||processing||!text||(text===last&&now-lastAt<2500))return;last=text;lastAt=now;processing=true;try{scanner.pause(true)}catch(e){}status('scanStatus','QR detected. Recording attendance...');try{const r=await request('scan',text),s=r.result.student||{};counts.success++;$('latest').textContent=(s.fullName||'Student')+(s.studentNumber?' - '+s.studentNumber:'');history('success',(s.fullName||s.studentNumber||'Student')+': attendance recorded');status('scanStatus','Attendance recorded. Ready for the next student.','ok')}catch(e){const dup=/already recorded/i.test(e.message);counts[dup?'duplicate':'failed']++;history(dup?'duplicate':'failed',e.message);status('scanStatus',e.message+(running?' Ready for the next student.':''),dup?'':'err')}finally{update();processing=false;if(running&&scanner){try{scanner.resume()}catch(e){}}}}
$('start').addEventListener('click',async()=>{if(!connected||running)return;if(typeof Html5Qrcode==='undefined'){status('scanStatus','QR scanner library did not load. Check the connection and refresh.','err');return}$('start').disabled=true;status('scanStatus','Starting camera...');try{scanner=new Html5Qrcode('reader',false);session++;await scanner.start({facingMode:'environment'},{fps:10,qrbox:(w,h)=>{const z=Math.max(180,Math.min(280,Math.floor(Math.min(w,h)*.7)));return{width:z,height:z}}},detected,()=>{});running=true;$('stop').disabled=false;status('scanStatus','Scanning. Hold a student QR inside the box.','ok')}catch(e){scanner=null;$('start').disabled=false;status('scanStatus',String(e&&e.message||e),'err')}});
$('stop').addEventListener('click',async()=>{running=false;processing=false;$('stop').disabled=true;if(scanner){try{await scanner.stop();await scanner.clear()}catch(e){}scanner=null}$('start').disabled=!connected;status('scanStatus','Scanner stopped.')});
window.addEventListener('pagehide',()=>{if(scanner){try{scanner.stop()}catch(e){}}});document.addEventListener('visibilitychange',()=>{if(document.hidden&&running)$('stop').click()});
})();</script></body></html>
